<html>
  <body>
    <script>
      a = parseInt(prompt("enter first no"));
      b = parseInt(prompt("enter second no"));

      document.write("first no:" + a);
      document.write("<br/>second no:" + b);

      if (a > b) document.write("<br/> first no is bigger");
      else if (b > a) document.write("<br/> second no is bigger");
      else document.write("<br/> both are equal");
    </script>
  </body>
</html>
