<html>
  <body>
    <script>
      a = parseInt(prompt("enter first no"));
      b = parseInt(prompt("enter second no"));
      c = a + b;
      d = a - b;
      e = a * b;
      f = a / b;
      g = (a + b) / 2;
      h = (a * b) / 2;
      i = a * b - a;

      document.write("first no:" + a);
      document.write("<br/> second no:" + b);
      document.write("<br/> sum of no:" + c);
      document.write("<br/> subtraction of no:" + d);
      document.write("<br/> multiplication of no:" + e);
      document.write("<br/> division of no:" + f);
      document.write("<br/> sum of no:" + g);
      document.write("<br/> multiplication of no:" + h);
      document.write("<br/> subtraction of no:" + i);
    </script>
  </body>
</html>
