<html>
  <body>
    <input type="button" value="red" onclick="f1()" />
    <input type="button" value="green" onclick="f2()" />
    <input type="button" value="navy" onclick="f3()" />

    <script>
      function f1() {
        document.bgColor = "red";
      }
      function f2() {
        document.bgColor = "green";
      }
      function f3() {
        document.bgColor = "navy";
      }
    </script>
  </body>
</html>
