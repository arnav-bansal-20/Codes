<html>
  <body>
    <script>
      a = parseInt(prompt("enter no"));
      b = Math.sqrt(a);
      document.write("<br/>" + a);
      document.write("<br/>square:" + a * a);
      document.write("<br/>cube:" + a * a * a);
      document.write("<br/>square root:" + b);
      f = 1;
      for (c = a; c >= 1; c--) {
        f = f * c;
      }
      document.write("<br/> factorial:" + f);
    </script>
  </body>
</html>
