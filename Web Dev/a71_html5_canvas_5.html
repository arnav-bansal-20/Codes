<html>
  <head>
    <script>
      window.onload = function () {
        canvas = document.getElementById("abc");
        ctext = canvas.getContext("2d");
        ctext.beginPath();
        ctext.moveTo(178, 150);
        ctext.quadraticCurveTo(220, 0, 320, 150);
        ctext.lineWidth = 15;
        ctext.strokeStyle = "fuchsia";
        ctext.stroke();
      };
    </script>
  </head>
  <body>
    <canvas id="abc" width="378" height="200"></canvas>
  </body>
</html>
