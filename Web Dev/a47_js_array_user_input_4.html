<html>
  <body>
    <script>
      abc = new Array(10);
      for (a = 0; a <= 9; a++) {
        abc[a] = parseInt(prompt("enter no"));
        document.write("<br/>" + abc[a]);
      }
      for (a = 9; a >= 0; a--) {
        document.write("<br/>" + abc[a]);
      }
    </script>
  </body>
</html>
