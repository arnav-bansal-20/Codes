<html>
  <body>
    <script>
      s = "APTECH COMPUTER EDUCATION";
      document.write("<br/>value:" + s);

      document.write("<br/>charAt:" + s.charAt(2));

      document.write("<br/>indexOf:" + s.indexOf("T"));

      document.write("<br/>lastIndexOf:" + s.lastIndexOf("T"));

      document.write("<br/>replace:" + s.replace("T", "K"));

      document.write("<br/>substring:" + s.substring(2));

      document.write("<br/>substring:" + s.substring(2, 5));

      document.write("<br/>split:" + s.split(" "));

      document.write("<br/>tolowercase:" + s.toLowerCase());

      document.write("<br/>touppercase:" + s.toUpperCase());

      document.write("<br/>concat:" + s.concat("fatehabad"));

      document.write("<br/>length:" + s.length);
    </script>
  </body>
</html>
