<html>
  <head>
    <title>Load and Initialize Google Maps</title>
    <style>
      html {
        height: 100%;
      }
      body {
        height: 100%;
        width: 100%;
        margin: 10%;
      }
      #abc {
        height: 100%;
        width: 100%;
      }
    </style>

    <script src="http://maps.google.com/maps/api/js?sensor=false"></script>

    <script>
      function f1() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(f2);
        }
      }
      function f2(p) {
        num = new google.maps.LatLng(p.coords.latitude, p.coords.longitude);
        myOptions = {
          zoom: 16,
          center: num,
          mapTypeId: google.maps.MapTypeId.HYBRID,
        };
        mymap = new google.maps.Map(document.getElementById("abc"), myOptions);
        marker = new google.maps.Marker({
          position: num,
          map: mymap,
          title: "Current Location",
        });
      }
    </script>
  </head>

  <body onload="f1()">
    <div id="abc"></div>
  </body>
</html>
