<html>
  <head>
    <script>
      window.onload = function () {
        canvas = document.getElementById("abc");
        ctext = canvas.getContext("2d");
        ctext.font = "italic 30pt Calibri";
        ctext.fillStyle = "MediumVioletRed";
        ctext.fillText("CRICKET", 40, 100);
      };
    </script>
  </head>
  <body>
    <canvas id="abc" width="380" height="170"></canvas>
  </body>
</html>
