<html>
  <body>
    <script>
      a = parseInt(prompt("enter first no"));
      b = parseInt(prompt("enter second no"));

      document.write("first no:" + a);
      document.write("<br/> second no:" + b);

      if (a % 2 == 0) document.write("<br/> first no is even");
      else if (b % 2 == 0) document.write("<br/> second no is even");
    </script>
  </body>
</html>
