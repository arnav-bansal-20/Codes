<html>
  <head>
    <center>
      <script>
        d = new Date();
        document.write("DAY:" + d.getDate());
        document.write("<br/>MONTH:" + d.getMonth());
        document.write("<br/>YEAR:" + d.getFullYear());
        document.write("<br/>HOUR:" + d.getHours());
        document.write("<br/>MINUTE:" + d.getMinutes());
        document.write("<br/>SECOND:" + d.getSeconds());
      </script>
    </center>
  </head>
</html>
