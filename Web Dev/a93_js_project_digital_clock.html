<html>
  <head>
    <center>
      <style>
        Div {
          width: 600;
          height: 600;
          border-radius: 50%;
          background: navy;
        }
        .c1 {
          color: red;
          background: pink;
          text-align: center;
          font-size: 20;
        }
      </style>

      <div>
        <br /><br /><br /><br /><br /><br />

        <h1 style="color: white; font-size: 60">Digital Clock</h1>

        <br /><br /><br />

        <input type="text" name="t1" id="t1" size="2" class="c1" />

        <input type="text" name="t2" id="t2" size="2" class="c1" />

        <input type="text" name="t3" id="t3" size="2" class="c1" />
      </div>

      <script>
        setInterval("f1()", 1000);
        function f1() {
          d = new Date();
          t1.value = +d.getHours();
          t2.value = +d.getMinutes();
          t3.value = +d.getSeconds();
        }
      </script>
    </center>
  </head>
</html>
