<html>
  <body>
    <script>
      names = new Array("Amit", "Virat", "Sachin");

      document.write("<br/>Length:  " + names.length);

      document.write("<br/> Name:" + names.join(","));

      document.write(
        "<br/> Rohit and Hardik are Added:  " + names.push("Rohit", "Hardik")
      );

      document.write("<br/>Name (In Ascending Order):" + names.sort());

      document.write("<br/>Name Removed:" + names.pop());
    </script>
  </body>
</html>
