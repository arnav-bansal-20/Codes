<html>

<head>
    <style>
        .c1 {
            color: white;
            background: navy;
            font-size: 20;
            padding: 10px;
            text-align: center
        }

        .c2 {
            color: red;
            background: pink;
            font-size: 20;
            padding: 10px;
            text-align: center
        }

        </head>
    </style>



    <center>
        <table>
            <tr>
                <td class="c1"> ENTER NO </td>
                <td> <input type="text" name="t1" id="t1" class="c1"> </td>
            </tr>


            <tr>
                <td class="c1"> RESULT </td>
                <td> <input type="text" name="t2" id="t2" class="c1"> </td>
            </tr>
    </center>
    </table>


    <input type="button" value="square" onclick="f1()" class="c2">
    <input type="button" value="cube" onclick="f2()" class="c2">
    <input type="button" value="square root" onclick="f3()" class="c2">
    <input type="button" value="factorial" onclick="f4()" class="c2">


    <script>
        function f1() {
            t2.value = parseInt(t1.value) * parseInt(t1.value)
        }
        function f2() {
            t2.value = parseInt(t1.value) * parseInt(t1.value) * parseInt(t1.value)

        }
        function f3() {
            t2.value = parseInt(Math.sqrt(t1.value))
        }
        function f4() {
            f = 1
            for (c = a; c >= 1; c--) {
                f = f * c
            }
            t2.value = parseint(f)
        }
    </script>

</html>
