<html>
  <body>
    <script>
      a = parseInt(prompt("enter first no"));
      document.write("first no:" + a);
      if (a % 3 == 0 && a % 5 == 0)
        document.write("<br/> a is divisible by 3 and 5");
      else if (a % 3 == 0) document.write("<br/> a is divisible by 3");
      else if (a % 5 == 0) document.write("<br/> a is divisible by 5");
      else document.write("<br/> non divisible");
    </script>
  </body>
</html>
