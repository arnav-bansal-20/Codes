    <html>
    <body>
        <script>
        a = parseInt(prompt("enter first no"));
        b = parseInt(prompt("enter second no"));
        c = parseInt(prompt("enter third no"));

        document.write("first no:" + a);
        document.write("<br/>second no:" + b);
        document.write("<br/>third no:" + c);

        if (a > b && a > c) document.write("<br/> first no is bigger");
        else if (b > a && b > c) document.write("<br/> second no is bigger");
        else if (c > a && c > b) document.write("<br/> third no is bigger");
        </script>
    </body>
    </html>
