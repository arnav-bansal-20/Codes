<html>
  <head>
    <script>
      window.onload = function () {
        canvas = document.getElementById("abc");
        ctext = canvas.getContext("2d");
        ctext.beginPath();
        ctext.rect(30, 50, 150, 100);
        ctext.fillStyle = "magenta";
        ctext.fill();
        ctext.lineWidth = 8;
        ctext.strokeStyle = "green";
        ctext.stroke();
      };
    </script>
  </head>
  <body>
    <canvas id="abc" width="360" height="200"></canvas>
  </body>
</html>
