<html>
  <head>
    <style>
      Div {
        width: 200px;
        height: 200px;
        background: red;
        position: relative;
        border-radius: 50%;
        animation-name: abc;
        animation-duration: 4s;
        animation-timing-function: linear;
        animation-delay: 1s;
        animation-iteration-count: 4;
        animation-direction: alternate;
        animation-play-state: running;
      }
      @keyframes abc {
        0% {
          background: red;
          left: 0px;
          top: 0px;
        }
        25% {
          background: yellow;
          left: 300px;
          top: 0px;
        }
        50% {
          background: blue;
          left: 300px;
          top: 300px;
        }
        75% {
          background: green;
          left: 0px;
          top: 300px;
        }
        100% {
          background: red;
          left: 0px;
          top: 0px;
        }
      }
    </style>
  </head>
  <body>
    <p><b>Note:</b>Animation</p>
    <div></div>
  </body>
</html>
